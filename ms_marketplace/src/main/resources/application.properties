server.port=${SERVER_PORT:8087}
server.servlet.session.timeout=15m
# health + info only. `*` combined with permitAll on /actuator/** serves /actuator/env and friends —
# including the datasource password — to anyone who asks. Add endpoints back one at a time, and
# secure them, rather than restoring `*` (roadmap P3-06).
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true

#info
info.app.name=Verborum Marketplace Micro Service
info.app.version=1.0.0

#PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/vdbmarket}
spring.datasource.username=${DB_USER:coldtea}
spring.datasource.password=${DB_PASSWORD:qwerty}
spring.datasource.driver-class-name=org.postgresql.Driver

#Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.json

#RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:verborum}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:verborum}

#RabbitMQ - listener retry before a message is dead-lettered
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.multiplier=2.0

#Config variables
# Must match ms_dictionary's list exactly — it validates what gets stored, this validates the filter
supported.languages=EN,DE,FR,ES,IT,PT,NL,TR,AZ,LT,PL,UK,AR,FA,JA,ZH,KO,EL,RU

#Security - Keycloak resource server (JWT validation)
# jwk-set-uri is set alongside issuer-uri on purpose: it makes key fetching lazy, so the service
# still boots while Keycloak is down. Do not remove it as a duplicate.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/verborum}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/verborum/protocol/openid-connect/certs}
# SEC-05: only access tokens minted for the Verborum API — aud must contain this. The realm adds it to
# verborum-app and verborum-dev-cli (audience mapper); a service-account or other client token is a 401
spring.security.oauth2.resourceserver.jwt.audiences=${VERBORUM_JWT_AUDIENCE:verborum-api}

# SEC-12: the API docs are open (permitAll) in SecurityConfig, so they are switched off outside local
# development by setting SWAGGER_ENABLED=false — they map every endpoint and DTO for anyone who asks.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
