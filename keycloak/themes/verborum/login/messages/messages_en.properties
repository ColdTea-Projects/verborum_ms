# Verborum login-theme message overrides. Strings for the passwordless email-code screen
# (rendered by login-email-code.ftl / the email-code authenticator SPI).

# "Try another way" selection labels for the email-code authenticator. Keycloak looks these up by
# <provider-id>-display-name / -help-text; without them the raw keys show on the selection screen.
verborum-email-code-display-name=Email me a sign-in code
verborum-email-code-help-text=We''ll email a one-time code so you can sign in without a password.

emailCodeTitle=Enter your sign-in code
emailCodeInstruction=We emailed a 6-digit code to your address. Enter it below to sign in.
emailCodeLabel=Sign-in code
emailCodeResend=Send a new code

# Error messages surfaced by the authenticator (context.form().setError(...)).
emailCodeInvalid=That code isn''t right. Check the email and try again.
emailCodeExpired=That code has expired. Request a new one to continue.
emailCodeTooManyAttempts=Too many incorrect attempts. Please start again.
emailCodeSendFailed=We couldn''t send your code right now. Please try again in a moment.

# Resend throttling (cooldown + per-session cap).
emailCodeResendWait=Please wait {0} seconds before requesting another code.
emailCodeResendLimit=You''ve requested too many codes. Please start again.
emailCodeResent=A new code has been sent to your email.
