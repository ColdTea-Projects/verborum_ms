# Verborum login theme.
#
# Extends the stock `keycloak` theme so every template (login, registration, verify-email,
# forgot-password, OTP, social buttons) keeps working — we only layer our design on top via an
# extra stylesheet. Nothing here is secret; the theme is committed and mounted into the container.
#
# Design language mirrors the Android app (core/theme/Color.kt): crimson accent, gold secondary,
# near-black/white surfaces, system sans-serif. Light + dark handled in verborum.css via
# prefers-color-scheme.
parent=keycloak
import=common/keycloak

# Base keycloak login CSS first, then our overrides last so they win.
styles=css/login.css css/verborum.css
