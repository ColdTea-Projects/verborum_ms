# Verborum email copy overrides. The verification HTML/text templates are overridden directly, so
# here we mainly set friendly subjects and de-jargon the admin-triggered "execute actions" mail
# (params: {0}=link, {2}=realm/app name, {3}=action list, {4}=link expiration).

emailVerificationSubject=Confirm your Verborum email

# Passwordless sign-in code (sent by the email-code authenticator SPI).
emailCodeSubject=Your Verborum sign-in code

# Wording of the email bodies (templates email-code.ftl and email-verification.ftl, html and text).
emailCodeHeading=Your sign-in code
emailCodeIntro=Enter this code to finish signing in to Verborum:
emailCodeExpires=This code expires in {0} minutes. If you didn''t try to sign in, you can ignore this email.
emailVerificationHeading=Confirm your email
emailVerificationIntro=Welcome to Verborum! Confirm this email address to finish setting up your account.
emailVerificationButton=Verify my email
emailVerificationExpires=This link expires in {0}.
emailVerificationFallback=If the button doesn''t work, paste this link into your browser:
emailVerificationIgnore=If you didn''t create a Verborum account, you can ignore this message.

# Admin-initiated account actions (rare; real self-service reset uses the password-reset template).
# Reworded so it never reads like the alarming stock "your administrator has requested..." message.
executeActionsSubject=Action needed on your Verborum account
executeActionsBody=Hi,\n\nTo keep your Verborum account up to date, please complete the following: {3}.\n\nOpen this link to continue:\n\n{0}\n\nThis link expires in {4}. If you weren''t expecting this, you can ignore this message and nothing will change.
executeActionsBodyHtml=<p>To keep your Verborum account up to date, please complete the following: {3}.</p><p><a href="{0}">Continue</a></p><p>This link expires in {4}. If you weren''t expecting this, you can ignore this message and nothing will change.</p>
emailFooter=You received this because this address was used with Verborum. If it wasn''t you, you can safely ignore this email.
emailTagline=Language, one word at a time
