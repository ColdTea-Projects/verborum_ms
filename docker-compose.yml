# Root compose — brings up the full local backend infrastructure in one command:
#   RabbitMQ + every service database + a single Adminer.
# The per-service compose files (ms_dictionary/, ms_user/) still work standalone for
# working on one service in isolation. Do not run both at once — the host ports clash.

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: verborum-rabbitmq
    ports:
      - "5672:5672"     # AMQP protocol
      - "15672:15672"   # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: verborum
      RABBITMQ_DEFAULT_PASS: verborum
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  db_dictionary:
    image: postgres:14-alpine
    container_name: verborum-db-dictionary
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: coldtea
      POSTGRES_PASSWORD: qwerty
      POSTGRES_DB: vdbdictionary
    volumes:
      - db_dictionary_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coldtea -d vdbdictionary"]
      interval: 10s
      timeout: 5s
      retries: 5

  db_user:
    image: postgres:14-alpine
    container_name: verborum-db-user
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: coldtea
      POSTGRES_PASSWORD: qwerty
      POSTGRES_DB: vdbprofile
    volumes:
      - db_user_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coldtea -d vdbprofile"]
      interval: 10s
      timeout: 5s
      retries: 5

  db_market:
    image: postgres:14-alpine
    container_name: verborum-db-market
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: coldtea
      POSTGRES_PASSWORD: qwerty
      POSTGRES_DB: vdbmarket
    volumes:
      - db_market_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coldtea -d vdbmarket"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Identity server. Runs in dev mode (start-dev): H2 storage, no HTTPS requirement — local only.
  # --import-realm loads keycloak/import/verborum-realm.json ON FIRST START of an empty data volume,
  # so the realm, clients, roles and dev users are reproducible from git instead of hand-clicked.
  # Editing that file after the volume exists changes nothing: run
  #   docker compose down && docker volume rm verborum_ms_keycloak_data
  # to re-import. Changes made in the admin console are NOT written back to the file.
  keycloak:
    # Custom image = stock Keycloak 23 + the Verborum email-code authenticator SPI baked in.
    # See keycloak/passwordless-email-code/Dockerfile. Themes are still bind-mounted below.
    build: ./keycloak/passwordless-email-code
    image: verborum-keycloak:local
    container_name: verborum-keycloak
    command: start-dev --import-realm
    ports:
      - "8180:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Pins the issuer Keycloak stamps into every token, instead of echoing back whatever Host
      # header the caller used. Without this, a phone hitting http://192.168.0.x:8180 gets tokens
      # with iss=http://192.168.0.x:8180/... while the services validate iss=localhost:8180 — every
      # request then fails with a 401 that looks like a broken token rather than a config mismatch.
      # For device testing set this AND the services' KEYCLOAK_ISSUER_URI / KEYCLOAK_JWK_SET_URI to
      # the same LAN origin. See docs/agent/security.md.
      KC_HOSTNAME_URL: ${KEYCLOAK_HOSTNAME_URL:-http://localhost:8180}
      KC_HOSTNAME_ADMIN_URL: ${KEYCLOAK_HOSTNAME_URL:-http://localhost:8180}
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
      - keycloak_data:/opt/keycloak/data
      # Custom login theme (Verborum branding). start-dev disables theme caching, so edits to the
      # CSS show on a browser refresh — no rebuild. Prod bakes this into the image instead (COPY).
      - ./keycloak/themes:/opt/keycloak/themes:ro
    healthcheck:
      # The image has no curl/wget — talk to the socket directly and ask for the realm's
      # OIDC discovery document, which only answers once the realm is imported and live.
      test:
        - "CMD-SHELL"
        - "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/verborum/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  admin:
    image: adminer
    container_name: verborum-adminer
    restart: always
    depends_on:
      - db_dictionary
      - db_user
      - db_market
    ports:
      - "8080:8080"

  # Fake SMTP for local dev. Keycloak's realm smtpServer points here (host `mailpit`, 1025,
  # no auth), so email verification and passwordless email-code mail are captured — never sent —
  # and readable in the web UI at http://localhost:8025. Real SMTP is prod-only, injected by the
  # keycloak-bootstrap service. No secrets, safe to commit.
  mailpit:
    image: axllent/mailpit:latest
    container_name: verborum-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

  # Post-import secret injection. Native `--import-realm` cannot reliably substitute ${ENV} in the
  # realm JSON (Keycloak #12069/#26275), so anything secret or per-environment is applied AFTER the
  # realm is live, via kcadm.sh: the Google/Facebook identity providers and (staging/prod) the real
  # smtpServer credentials. Idempotent, and a NO-OP locally when the credentials are unset — so this
  # runs clean on a laptop with an empty .env. Exits when done. See keycloak/bootstrap/configure.sh.
  keycloak-bootstrap:
    image: quay.io/keycloak/keycloak:23.0.0
    container_name: verborum-keycloak-bootstrap
    restart: "no"
    depends_on:
      keycloak:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/bootstrap/configure.sh"]
    environment:
      KC_URL: http://keycloak:8080
      KC_REALM: verborum
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-no-reply@verborum.app}
      SMTP_FROM_DISPLAY_NAME: ${SMTP_FROM_DISPLAY_NAME:-Verborum}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      # Passwordless email-code login (needs the SPI in the custom keycloak image). ON by default —
      # the choose-password-or-code UX is browser-verified. Set false to fall back to password-only.
      EMAIL_CODE_ENABLED: ${EMAIL_CODE_ENABLED:-true}
    volumes:
      - ./keycloak/bootstrap:/bootstrap:ro

volumes:
  rabbitmq_data:
  db_dictionary_data:
  db_user_data:
  db_market_data:
  keycloak_data:
