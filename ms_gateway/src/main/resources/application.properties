server.port=${SERVER_PORT:8080}
server.servlet.session.timeout=15m
# health + info only. `*` combined with permitAll on /actuator/** serves /actuator/env and friends to
# anyone who asks (roadmap P3-06). Add endpoints back one at a time, and secure them.
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true

# SEC-07: largest accepted request body in bytes; 413 above it. The gateway is the first thing a body
# meets, so it carries the largest cap any service accepts (ms_dictionary and ms_user: 2 MB).
verborum.request.max-body-bytes=${MAX_REQUEST_BODY_BYTES:2097152}

#info
info.app.name=Verborum API Gateway
info.app.version=1.0.0

#Security - Keycloak resource server (JWT validation)
# jwk-set-uri is set alongside issuer-uri on purpose: it makes key fetching lazy, so the service
# still boots while Keycloak is down. Do not remove it as a duplicate.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/verborum}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/verborum/protocol/openid-connect/certs}
# SEC-05: only access tokens minted for the Verborum API — aud must contain this
spring.security.oauth2.resourceserver.jwt.audiences=${VERBORUM_JWT_AUDIENCE:verborum-api}

# Routes (P5-02). Every upstream is a variable, so containers later use service names with no code change.
# Only the path prefix decides; nothing is rewritten, and Authorization and X-Device-Id pass through
# unchanged. An unknown path matches no route and is a 404 in the error envelope.
spring.cloud.gateway.server.webmvc.routes[0].id=dictionary
spring.cloud.gateway.server.webmvc.routes[0].uri=${DICTIONARY_URL:http://localhost:8085}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/dictionaries/**,/words/**
spring.cloud.gateway.server.webmvc.routes[1].id=user
spring.cloud.gateway.server.webmvc.routes[1].uri=${USER_URL:http://localhost:8086}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/users/**
spring.cloud.gateway.server.webmvc.routes[2].id=marketplace
spring.cloud.gateway.server.webmvc.routes[2].uri=${MARKETPLACE_URL:http://localhost:8087}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/marketplace/**
spring.cloud.gateway.server.webmvc.routes[3].id=notification
spring.cloud.gateway.server.webmvc.routes[3].uri=${NOTIFICATION_URL:http://localhost:8088}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/notifications/**

# Upstream timeouts: a service that is down is a fast 502, one that hangs is a 504 — never a hung client
spring.cloud.gateway.server.webmvc.httpclient.connect-timeout=${GATEWAY_CONNECT_TIMEOUT:2s}
spring.cloud.gateway.server.webmvc.httpclient.read-timeout=${GATEWAY_READ_TIMEOUT:30s}

# Request bodies keep their Content-Length on the way to the service. The gateway strips it by default and
# forwards the body chunked, and every service's RequestBodyLimitFilter refuses a body with no declared
# length (411, SEC-07). Needs the Apache client (pom): the JDK client chunks regardless.
spring.cloud.gateway.server.webmvc.remove-content-length-request-headers-filter.enabled=false
