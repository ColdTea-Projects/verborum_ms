version: '3.8'

services :
  db:
    image: postgres:14-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: coldtea
      POSTGRES_PASSWORD: qwerty
      POSTGRES_DB: vdbdictionary
  admin:
    image: adminer
    restart: always
    depends_on:
      - db
    ports:
      # 8084, not 8080: 8080 is ms_gateway's (P5-01); this file and the root one are never run together
      - "127.0.0.1:8084:8080"