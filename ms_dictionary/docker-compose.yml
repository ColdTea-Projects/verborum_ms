version: '3.8'

services :
  db:
    image: postgres:14-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: coldtea
      POSTGRES_PASSWORD: qwerty
      POSTGRES_DB: vdbdictionary
  admin:
    image: adminer
    restart: always
    depends_on:
      - db
    ports:
      - "127.0.0.1:8080:8080"